name: Build APK

# Runs automatically on every push to main, and can also be triggered
# manually from the Actions tab (useful if you just want to re-run a build).
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        # Installs Gradle directly, which is why this repo does NOT need a
        # gradlew/gradle-wrapper.jar checked in - see README.md for why.
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniEngine2D-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
