<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MiniEngine2D</title>
<style>
  :root{
    --ink:#0d0b18;
    --dusk:#1a1530;
    --dusk-2:#241d3f;
    --rune:#3a3260;
    --gold:#ffb648;
    --ember:#ff6b6b;
    --mist:#f2eeff;
    --mist-dim:#9c92c2;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "Segoe UI Mono", Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; height:100%; background:var(--ink); color:var(--mist); font-family:var(--sans); overflow:hidden; }
  button, input, textarea, select{ font-family:inherit; color:inherit; }
  #app{ display:flex; flex-direction:column; height:100vh; }

  /* ---------- Preview (top half) ---------- */
  #previewPane{ flex:0 0 auto; background:var(--dusk); display:flex; flex-direction:column; border-bottom:1px solid var(--rune); }
  #previewHeader{ display:flex; align-items:center; justify-content:space-between; padding:8px 12px;
    font-family:var(--mono); font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--mist-dim);
    border-bottom:1px solid var(--rune); flex:0 0 auto; gap:8px; }
  #previewHeader .live{ display:inline-flex; align-items:center; gap:6px; flex:0 0 auto; }
  #previewHeader .dot{ width:7px;height:7px;border-radius:50%; background:var(--gold); display:inline-block;
    animation: pulse 2s ease-in-out infinite; }
  #hudInfo{ flex:1; text-align:center; }
  @media (prefers-reduced-motion: reduce){ #previewHeader .dot{ animation:none; } }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }
  #canvasWrap{ flex:0 0 auto; display:flex; align-items:center; justify-content:center; padding:14px; position:relative; }
  #gameCanvas{ background:var(--ink); border-radius:3px; display:block; width:100%; height:auto;
    box-shadow: 0 0 0 2px var(--dusk-2), 0 0 0 4px var(--gold); touch-action:none; }

  /* ---------- Joystick overlay ---------- */
  #padWrap{ position:absolute; left:14px; bottom:14px; z-index:5; user-select:none; -webkit-user-select:none; }
  #joyBase{ width:84px; height:84px; border-radius:50%; background:rgba(36,29,63,.6);
    border:2px solid var(--rune); position:relative; touch-action:none; }
  #joyNub{ width:36px; height:36px; border-radius:50%; background:var(--gold); position:absolute;
    left:24px; top:24px; box-shadow:0 2px 6px rgba(0,0,0,.45); pointer-events:none; }

  /* ---------- Resource toolbar ---------- */
  #toolbar{ flex:0 0 auto; background:var(--dusk-2); border-bottom:1px solid var(--rune);
    display:flex; gap:6px; padding:8px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .tbtn{ flex:0 0 auto; background:var(--dusk); color:var(--mist); border:1px solid var(--rune); border-radius:4px;
    padding:8px 10px; font-family:var(--mono); font-size:11px; letter-spacing:.03em; white-space:nowrap;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 1px 0 rgba(0,0,0,.4); }
  .tbtn.add{ color:var(--ink); background:var(--gold); border-color:var(--gold); font-weight:700; }
  .tbtn:active{ transform:translateY(1px); box-shadow:none; }

  #palette{ flex:0 0 auto; display:flex; gap:6px; padding:8px; overflow-x:auto; background:var(--dusk-2);
    border-bottom:1px solid var(--rune); -webkit-overflow-scrolling:touch; }
  #palette:empty{ display:none; }
  .chip{ flex:0 0 auto; display:flex; align-items:center; gap:6px; background:var(--dusk); border:1px solid var(--rune);
    border-radius:3px; padding:5px 8px; font-family:var(--mono); font-size:11px; color:var(--mist-dim); white-space:nowrap; }
  .chip .sw{ width:10px;height:10px;border-radius:2px; border:1px solid rgba(255,255,255,.25); flex:0 0 auto; }
  .chip .nm{ color:var(--mist); }
  .chip .kind{ opacity:.55; font-size:10px; }

  /* ---------- Editor (bottom half) ---------- */
  #editorPane{ flex:1; display:flex; flex-direction:column; min-height:0; }
  #editorHeader{ display:flex; align-items:center; justify-content:space-between; padding:8px 12px;
    font-family:var(--mono); font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--mist-dim);
    border-bottom:1px solid var(--rune); flex:0 0 auto; }
  #editorHeader .btns{ display:flex; gap:6px; }
  #runBtn{ background:var(--gold); color:var(--ink); border:none; border-radius:4px; padding:6px 14px;
    font-family:var(--mono); font-weight:700; font-size:11px; letter-spacing:.04em; }
  #resetBtn{ background:transparent; color:var(--mist-dim); border:1px solid var(--rune); border-radius:4px;
    padding:6px 10px; font-family:var(--mono); font-size:11px; }
  #runBtn:active, #resetBtn:active{ transform:translateY(1px); }
  #codeInput{ flex:1; width:100%; resize:none; border:none; outline:none; background:var(--ink); color:#d8ffe4;
    font-family:var(--mono); font-size:13px; line-height:1.55; padding:12px; tab-size:2; border-top:2px solid transparent; }
  #codeInput:focus{ border-top-color:var(--gold); }
  #status{ flex:0 0 auto; padding:7px 12px; font-family:var(--mono); font-size:11px; min-height:16px;
    color:var(--mist-dim); border-top:1px solid var(--rune); background:var(--dusk); }
  #status.err{ color:var(--ember); }

  /* ---------- Modal ---------- */
  #modalBg{ position:fixed; inset:0; background:rgba(6,5,12,.65); display:none; align-items:flex-end; justify-content:center; z-index:50; }
  #modalBg.open{ display:flex; }
  #modal{ background:var(--dusk); width:100%; max-width:480px; border-radius:10px 10px 0 0; padding:16px;
    max-height:82vh; overflow-y:auto; box-shadow:0 0 0 2px var(--gold) inset; }
  #modal h3{ margin:0 0 12px; font-family:var(--mono); font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--gold); }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-family:var(--mono); font-size:10px; letter-spacing:.07em; text-transform:uppercase;
    color:var(--mist-dim); margin-bottom:5px; }
  .field input[type=text], .field input[type=number], .field textarea{
    width:100%; background:var(--ink); border:1px solid var(--rune); border-radius:6px;
    padding:9px 10px; color:var(--mist); font-size:14px; font-family:var(--sans); }
  .field input[type=color]{ width:100%; height:38px; border:1px solid var(--rune); border-radius:6px; background:var(--ink); padding:3px; }
  .row2{ display:flex; gap:8px; }
  .row2 > .field{ flex:1; }
  .checkField{ display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .checkField input{ width:18px; height:18px; flex:0 0 auto; }
  .checkField label{ margin:0; text-transform:none; letter-spacing:0; font-family:var(--sans); font-size:13px; color:var(--mist); }
  .modalBtns{ display:flex; gap:8px; margin-top:6px; }
  .modalBtns button{ flex:1; padding:11px; border-radius:6px; border:1px solid var(--rune);
    font-family:var(--mono); font-size:12px; letter-spacing:.04em; text-transform:uppercase;
    background:transparent; color:var(--mist-dim); }
  #saveBtn, #ioActionBtn, #terrainDoneBtn{ background:var(--gold); color:var(--ink); border-color:var(--gold); font-weight:700; }
  #deleteBtn{ background:transparent; color:var(--ember); border-color:rgba(255,107,107,.35); }
  #existingList{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  #modalError{ margin:0 0 10px; font-family:var(--sans); font-size:12px; color:var(--ember); }
  #modalError:empty{ display:none; }
  #existingList button{ background:var(--dusk-2); border:1px solid var(--rune); color:var(--mist); border-radius:4px;
    padding:6px 10px; font-family:var(--mono); font-size:11px; }
  #existingList button.active{ border-color:var(--gold); color:var(--gold); }
  #existingList .hint{ font-family:var(--sans); font-size:12px; color:var(--mist-dim); }
  .customProps .propRow{ display:flex; gap:6px; margin-bottom:6px; }
  .customProps .propRow input{ flex:1; }
  #addPropBtn{ background:transparent; border:1px dashed var(--rune); color:var(--mist-dim); border-radius:6px;
    padding:8px; width:100%; font-family:var(--mono); font-size:11px; letter-spacing:.04em; text-transform:uppercase; }

  button:focus-visible, input:focus-visible, select:focus-visible{
    outline:2px solid var(--gold); outline-offset:2px;
  }

  /* ---------- Export / Import (project save-load, text based) ---------- */
  .tbtn.io{ border-color:var(--mist-dim); color:var(--mist-dim); }
  #ioModalBg{ position:fixed; inset:0; background:rgba(6,5,12,.65); display:none; align-items:flex-end; justify-content:center; z-index:50; }
  #ioModalBg.open{ display:flex; }
  #ioModal{ background:var(--dusk); width:100%; max-width:480px; border-radius:10px 10px 0 0; padding:16px;
    max-height:82vh; overflow-y:auto; box-shadow:0 0 0 2px var(--gold) inset; }
  #ioModal h3{ margin:0 0 8px; font-family:var(--mono); font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--gold); }
  #ioModal p{ margin:0 0 10px; font-size:12px; color:var(--mist-dim); line-height:1.4; }
  #ioTextarea{ width:100%; min-height:180px; background:var(--ink); border:1px solid var(--rune); border-radius:6px;
    padding:10px; color:var(--mist); font-family:var(--mono); font-size:12px; resize:vertical; }

  /* ---------- Play mode (fullscreen + landscape) ---------- */
  body.playMode #toolbar, body.playMode #palette, body.playMode #editorPane{ display:none; }
  body.playMode #previewPane{ flex:1 1 auto; border-bottom:none; min-height:0; }
  body.standaloneGame #exitPlayBtn{ display:none; }
  #editThisGameBtn{ display:none; margin-left:auto; background:transparent; border:1px solid var(--rune);
    color:var(--mist-dim); font-family:var(--mono); font-size:10px; letter-spacing:.04em;
    text-transform:uppercase; padding:4px 8px; border-radius:4px; }
  body.standaloneGame #editThisGameBtn{ display:inline-block; }
  body.playMode #canvasWrap{ flex:1 1 auto; min-height:0; }
  body.playMode #gameCanvas{ width:100%; height:100%; object-fit:contain; }
  /* Bottom-anchored, not top - the top edge sits under the status bar /
     camera cutout on a lot of phones in landscape too, so it's kept clear. */
  #exitPlayBtn{ display:none; position:absolute; left:50%; bottom:14px; transform:translateX(-50%); z-index:8;
    width:38px; height:38px; border-radius:50%; background:rgba(13,11,24,.75); color:var(--mist);
    border:1px solid var(--rune); font-size:14px; align-items:center; justify-content:center; }
  body.playMode #exitPlayBtn{ display:flex; }

  /* Top-right: the bottom row is already joystick + attack + exit, so the
     bag lives up top. Occasional-use control, unlike exit, so the small
     camera-cutout risk up there is an acceptable trade-off here. */
  #bagBtn{ display:none; position:absolute; top:10px; right:10px; z-index:8;
    width:34px; height:34px; border-radius:50%; background:rgba(13,11,24,.75); color:var(--mist);
    border:1px solid var(--rune); font-size:16px; align-items:center; justify-content:center; }
  body.playMode #bagBtn{ display:flex; }
  #bagBtn .count{ position:absolute; bottom:-4px; right:-4px; background:var(--gold); color:var(--ink);
    font-family:var(--mono); font-size:10px; line-height:1; border-radius:8px; padding:2px 4px; min-width:12px; }

  #bagModalBg{ position:fixed; inset:0; background:rgba(6,5,12,.65); display:none;
    align-items:flex-end; justify-content:center; z-index:50; }
  #bagModalBg.show{ display:flex; }
  #bagModal{ width:100%; max-width:480px; max-height:70vh; overflow-y:auto; background:var(--dusk);
    border:1px solid var(--rune); border-radius:16px 16px 0 0; padding:16px;
    box-shadow:0 0 0 2px var(--gold) inset; box-sizing:border-box; }
  #bagList{ display:flex; flex-direction:column; gap:8px; margin:12px 0; }
  .bagItem{ display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.04);
    border:1px solid var(--rune); border-radius:10px; padding:8px 10px; text-align:left; width:100%;
    font-family:var(--sans); color:var(--mist); }
  .bagItem img{ width:28px; height:28px; object-fit:cover; image-rendering:pixelated; border-radius:4px; flex:none; }
  .bagItem .sw{ width:28px; height:28px; border-radius:4px; flex:none; }
  .bagItem .info{ flex:1; text-align:left; }
  .bagItem .info b{ display:block; font-size:13px; }
  .bagItem .info span{ display:block; font-size:11px; color:var(--mist-dim); margin-top:2px; }
  .bagItem .count{ font-family:var(--mono); font-size:12px; color:var(--mist-dim); }
  #bagEmpty{ font-family:var(--sans); font-size:12px; color:var(--mist-dim); text-align:center; padding:24px 0; }

  /* ---------- Interact / Attack button ---------- */
  #actionBtn{ display:none; position:absolute; right:14px; bottom:14px; z-index:5;
    width:76px; height:76px; border-radius:50%; border:2px solid var(--rune);
    background:rgba(36,29,63,.75); color:var(--mist); font-family:var(--mono);
    font-size:11px; letter-spacing:.03em; text-transform:uppercase; flex-direction:column;
    align-items:center; justify-content:center; gap:2px; }
  #actionBtn.show{ display:flex; }
  #actionBtn .glyph{ font-size:20px; }
  #actionBtn.attack{ border-color:var(--ember); color:var(--ember); }
  #actionBtn.talk{ border-color:var(--gold); color:var(--gold); }
  #actionBtn:active{ transform:translateY(1px); }

  /* ---------- Terrain painter ---------- */
  /* One scrolling container, not nested ones - simpler and less fragile.
     The footer sticks to the bottom of that single scroll, so it's always
     reachable whether the grid is short (common) or ever needs to scroll. */
  #terrainModalBg{ position:fixed; inset:0; background:var(--ink); display:none; z-index:50;
    overflow-y:auto; -webkit-overflow-scrolling:touch; }
  #terrainModalBg.open{ display:block; }
  #terrainModal{ min-height:100%; display:flex; flex-direction:column; background:var(--dusk); }
  #terrainGridScroll{ flex:0 0 auto; padding:16px; display:flex; align-items:center; justify-content:center; }
  #terrainGrid{ display:grid; grid-template-columns:repeat(9,1fr); gap:2px; background:var(--ink);
    padding:4px; border-radius:6px; touch-action:none; user-select:none; -webkit-user-select:none;
    max-width:480px; width:100%; margin:0 auto; }
  .terrainCell{ aspect-ratio:1; border-radius:2px; background:#1c1926; }
  /* Everything you interact with lives down here, on purpose - the very top
     of the screen sits under the status bar / camera cutout on a lot of
     phones and isn't reliably tappable, so nothing important goes there. */
  #terrainModalFoot{ flex:0 0 auto; margin-top:auto; position:sticky; bottom:0;
    background:var(--dusk-2); border-top:1px solid var(--rune);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); max-width:480px; width:100%;
    margin-left:auto; margin-right:auto; box-sizing:border-box; }
  #terrainTabs{ display:flex; gap:6px; overflow-x:auto; padding-bottom:10px; -webkit-overflow-scrolling:touch; }
  .terrainTab{ flex:0 0 auto; padding:7px 13px; border-radius:14px; border:1px solid var(--rune);
    background:var(--dusk); color:var(--mist-dim); font-family:var(--mono); font-size:11px; white-space:nowrap; }
  .terrainTab.active{ border-color:var(--gold); color:var(--gold); }
  #terrainAddRow{ display:flex; gap:6px; margin-bottom:12px; }
  #terrainAddRow input{ flex:1; min-width:0; background:var(--ink); border:1px solid var(--rune); border-radius:8px;
    padding:8px 10px; color:var(--mist); font-size:13px; font-family:var(--sans); }
  #terrainAddRow button{ flex:0 0 auto; background:var(--gold); color:var(--ink); border:none; border-radius:8px;
    padding:8px 14px; font-family:var(--mono); font-size:12px; font-weight:700; }
  #terrainPalette{ display:flex; gap:6px; overflow-x:auto; padding-bottom:12px; -webkit-overflow-scrolling:touch; }
  .terrainSwatch{ flex:0 0 auto; width:42px; height:42px; border-radius:6px; border:2px solid var(--rune);
    background:var(--dusk-2);
    display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--mist); }
  .terrainSwatch.selected{ border-color:var(--gold); box-shadow:0 0 0 1px var(--gold); }
  #terrainLinkHint{ margin:0 0 10px; font-family:var(--sans); font-size:11px; line-height:1.4; color:var(--mist-dim); }
  #terrainLinkHint b{ color:var(--mist); font-weight:600; }
  #terrainError{ margin:0 0 10px; font-family:var(--sans); font-size:12px; color:var(--ember); }
  #terrainError:empty{ display:none; }
  #terrainModalFoot .modalBtns{ margin:0; }

  /* ---------- Terrain connector ---------- */
  #connectorModalBg{ position:fixed; inset:0; background:var(--ink); display:none; z-index:50;
    overflow-y:auto; -webkit-overflow-scrolling:touch; }
  #connectorModalBg.open{ display:block; }
  #connectorModal{ min-height:100%; display:flex; flex-direction:column; background:var(--dusk); }
  #connectorScroll{ flex:0 0 auto; padding:16px; }
  #connectorScroll h3{ margin:0 0 12px; font-family:var(--mono); font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--gold); }
  #connectorExisting{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; }
  #connectorExisting button{ background:var(--dusk-2); border:1px solid var(--rune); color:var(--mist);
    border-radius:8px; padding:8px 10px; font-family:var(--mono); font-size:11px; text-align:left; }
  #connectorExisting button.active{ border-color:var(--gold); color:var(--gold); }
  #connectorExisting .hint{ font-family:var(--sans); font-size:12px; color:var(--mist-dim); }
  #connectorScroll select{ width:100%; background:var(--ink); border:1px solid var(--rune); border-radius:8px;
    padding:9px 10px; color:var(--mist); font-size:14px; font-family:var(--sans); margin-top:0; }
  .pickGrid{ display:grid; grid-template-columns:repeat(9,1fr); gap:2px; background:var(--ink);
    padding:4px; border-radius:6px; max-width:420px; margin:10px auto 18px; touch-action:manipulation; }
  .pickCell{ aspect-ratio:1; border-radius:2px; border:2px solid transparent; padding:0; }
  .pickCell.selected{ border-color:var(--gold); box-shadow:0 0 0 1px var(--gold); }
  #connectorFoot{ flex:0 0 auto; margin-top:auto; position:sticky; bottom:0;
    background:var(--dusk-2); border-top:1px solid var(--rune);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); max-width:480px; width:100%;
    margin-left:auto; margin-right:auto; box-sizing:border-box; }
  #connectorError{ margin:0 0 10px; font-family:var(--sans); font-size:12px; color:var(--ember); }
  #connectorError:empty{ display:none; }

  /* ---------- Sprite upload preview ---------- */
  .spritePreview{ display:flex; align-items:center; gap:10px; margin-top:8px; }
  .spritePreview img{ width:40px; height:40px; object-fit:contain; background:var(--ink);
    border:1px solid var(--rune); border-radius:6px; image-rendering:pixelated; }
  .spritePreview button{ background:transparent; border:1px solid rgba(255,107,107,.35); color:var(--ember);
    border-radius:6px; padding:6px 10px; font-family:var(--mono); font-size:11px; }
  .chip img.sw{ object-fit:cover; image-rendering:pixelated; }
</style>
</head>
<body>
<div id="app">

  <div id="previewPane">
    <div id="previewHeader">
      <span class="live"><span class="dot"></span>Live Preview</span>
      <span id="hudInfo"></span>
      <span id="gridInfo"></span>
      <button id="editThisGameBtn" type="button" style="display:none;">Edit this game</button>
    </div>
    <div id="canvasWrap">
      <canvas id="gameCanvas"></canvas>
      <div id="padWrap"><div id="joyBase"><div id="joyNub"></div></div></div>
      <button id="actionBtn" type="button"><span class="glyph">&#9876;</span><span class="txt">Attack</span></button>
      <button id="bagBtn" type="button" title="Inventory"><span class="glyph">&#127890;</span></button>
      <button id="exitPlayBtn" type="button" title="Exit play mode">&#10005;</button>
    </div>
  </div>

  <div id="toolbar">
    <button class="tbtn add" data-open="block">+ Block</button>
    <button class="tbtn" data-edit="block">Edit Block</button>
    <button class="tbtn add" data-open="character">+ Character</button>
    <button class="tbtn" data-edit="character">Edit Character</button>
    <button class="tbtn add" data-open="npc">+ NPC</button>
    <button class="tbtn" data-edit="npc">Edit NPC</button>
    <button class="tbtn add" data-open="mob">+ Mob</button>
    <button class="tbtn" data-edit="mob">Edit Mob</button>
    <button class="tbtn add" data-open="item">+ Item</button>
    <button class="tbtn" data-edit="item">Edit Item</button>
    <button class="tbtn add" data-open="custom">+ Custom Resource</button>
    <button class="tbtn add" id="terrainAddBtn" type="button">+ Terrain</button>
    <button class="tbtn" id="terrainEditBtn" type="button">Edit Terrain</button>
    <button class="tbtn add" id="connectorAddBtn" type="button">+ Terrain Connector</button>
    <button class="tbtn" id="connectorEditBtn" type="button">Edit Terrain Connector</button>
    <button class="tbtn io" id="exportBtn" type="button">Export</button>
    <button class="tbtn io" id="importBtn" type="button">Import</button>
    <button class="tbtn io" id="exportGameBtn" type="button">Export Game (HTML)</button>
  </div>

  <div id="palette"></div>

  <div id="editorPane">
    <div id="editorHeader">
      <span>Script</span>
      <span class="btns">
        <button id="resetBtn" type="button" title="Reset play state">&#8635; Reset</button>
        <button id="runBtn" type="button">&#9654; Run</button>
      </span>
    </div>
    <textarea id="codeInput" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
    <div id="status"></div>
  </div>

</div>

<div id="modalBg">
  <div id="modal">
    <h3 id="modalTitle">New Block</h3>
    <div id="existingList"></div>
    <div id="formFields"></div>
    <p id="modalError"></p>
    <div class="modalBtns">
      <button id="cancelBtn" type="button">Cancel</button>
      <button id="deleteBtn" type="button" style="display:none;">Delete</button>
      <button id="saveBtn" type="button">Save</button>
    </div>
  </div>
</div>

    <div class="modalBtns">

<script>
(function(){
  "use strict";

  // Replaced by exportGameHtml() when producing a standalone game file.
  // Left as null, this file behaves exactly like the normal editor.
  var EXPORTED_GAME = null;

  var HERO_ATTACK_DAMAGE = 25;
  var MOB_ATTACK_DAMAGE = 10;

  // ---------------- Resource store (the "palette" - persists across script runs) ----------------
  var resources = { block:{}, character:{}, npc:{}, mob:{}, item:{}, custom:{} };

  var TYPE_META = {
    block:     { label:"Block",     icon:"\u25A6" },
    character: { label:"Character", icon:"\u263A" },
    npc:       { label:"NPC",       icon:"\u25D4" },
    mob:       { label:"Mob",       icon:"\u2726" },
    item:      { label:"Item",      icon:"\u25C6" },
    custom:    { label:"Custom",    icon:"\u25C8" }
  };

  var DEFAULT_CODE =
"// Move the Hero with the joystick (bottom-left of the preview)!\n" +
"// Bump into the Slime to fight it.\n" +
"engine.setBlock(2, 2, \"Tree\");\n" +
"engine.setBlock(3, 2, \"Tree\");\n" +
"engine.addCharacter(\"Hero\", 4, 4);\n" +
"engine.addMob(\"Slime\", 6, 4);\n";

  // Starter resources + script - only used the very first time there's nothing saved yet.
  function applyDefaults(){
    resources.block.Grass = { name:"Grass", color:"#3d8b45", solid:false };
    resources.block.Tree  = { name:"Tree",  color:"#245c34", solid:true };
    resources.block.Road  = { name:"Road",  color:"#6b4423", solid:false };
    resources.character.Hero = { name:"Hero", color:"#ffd76a", health:100, speed:3 };
    resources.mob.Slime = { name:"Slime", color:"#5ee3b5", health:30, speed:2 };
    codeInput.value = DEFAULT_CODE;
  }

  // One-time top-up for projects saved before Road existed - runs once ever
  // (tracked separately from the project autosave) so it won't resurrect a
  // Road block you've since deleted or renamed on purpose.
  function ensureRoadBlockSeeded(){
    var FLAG = 'miniengine2d.roadSeeded.v1';
    try{
      if(localStorage.getItem(FLAG)) return;
      if(!resources.block.Road){ resources.block.Road = { name:"Road", color:"#6b4423", solid:false }; }
      localStorage.setItem(FLAG, '1');
    }catch(e){}
  }

  // Silent autosave (separate from the manual Export/Import text below): every
  // successful or failed Run tries to persist to this device automatically,
  // so closing and reopening the app just works with no extra steps.
  var STORAGE_KEY = 'miniengine2d.autosave.v1';
  function saveLocal(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ resources:resources, script:codeInput.value }));
      return true;
    }catch(e){ return false; }
  }
  function loadLocal(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return false;
      var data = JSON.parse(raw);
      if(!data || !data.resources || typeof data.script !== 'string') return false;
      resources = data.resources;
      ['block','character','npc','mob','item','custom'].forEach(function(t){ if(!resources[t]) resources[t] = {}; });
      codeInput.value = data.script;
      return true;
    }catch(e){ return false; }
  }

  // ---------------- Grid / canvas ----------------
  var COLS = 9, ROWS = 6, CELL = 40;
  var DEFAULT_TERRAIN = 'Terrain 1';
  var canvas = document.getElementById('gameCanvas');
  canvas.width = COLS*CELL; canvas.height = ROWS*CELL;
  canvas.style.aspectRatio = COLS + ' / ' + ROWS;
  var ctx = canvas.getContext('2d');

  // A scene is a set of named terrains (each its own COLS x ROWS grid +
  // entity list) plus which one is currently active. Only the active
  // terrain is ever rendered/walked around in - moving onto a block with
  // a "leads to another terrain" link switches which one is active.
  function emptyGrid(){
    var grid = [];
    for (var r=0;r<ROWS;r++){ grid.push(new Array(COLS).fill(null)); }
    return grid;
  }
  function emptyScene(){
    return { terrains: {}, active: DEFAULT_TERRAIN };
  }
  var scene = emptyScene();
  function ensureTerrain(name){
    if(!scene.terrains[name]) scene.terrains[name] = { grid: emptyGrid(), entities: [], connectors: [] };
    if(!scene.terrains[name].connectors) scene.terrains[name].connectors = [];
    return scene.terrains[name];
  }
  function currentTerrain(){ return ensureTerrain(scene.active); }

  function render(){
    document.getElementById('gridInfo').textContent = scene.active + ' \u00B7 ' + COLS + '\u00D7' + ROWS;
    var t = currentTerrain();
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle = "#241d3f";
    for(var x=0;x<=COLS;x++){ ctx.beginPath(); ctx.moveTo(x*CELL,0); ctx.lineTo(x*CELL,ROWS*CELL); ctx.stroke(); }
    for(var y=0;y<=ROWS;y++){ ctx.beginPath(); ctx.moveTo(0,y*CELL); ctx.lineTo(COLS*CELL,y*CELL); ctx.stroke(); }

    for(var r=0;r<ROWS;r++){
      for(var c=0;c<COLS;c++){
        var name = t.grid[r][c];
        if(!name) continue;
        var def = resources.block[name];
        var drewSprite = false;
        if (def && def.spriteUrl) {
          var bimg = getSpriteImage(def.spriteUrl);
          if (bimg.complete && bimg.naturalWidth) {
            ctx.drawImage(bimg, c*CELL+1, r*CELL+1, CELL-2, CELL-2);
            drewSprite = true;
          }
        }
        if (!drewSprite) {
          ctx.fillStyle = def ? def.color : "#555";
          ctx.fillRect(c*CELL+1, r*CELL+1, CELL-2, CELL-2);
        }
        if (def && def.solid) {
          ctx.strokeStyle = 'rgba(13,11,24,.55)';
          ctx.lineWidth = 3;
          ctx.strokeRect(c*CELL+3, r*CELL+3, CELL-6, CELL-6);
        }
      }
    }

    (t.connectors||[]).forEach(function(conn){
      var cx = conn.x*CELL + CELL/2, cy = conn.y*CELL + CELL/2;
      ctx.beginPath();
      ctx.arc(cx, cy, CELL*0.34, 0, Math.PI*2);
      ctx.strokeStyle = '#ffb648';
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.fillStyle = '#ffb648';
      ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('\u2192', cx, cy+5);
    });

    t.entities.forEach(function(e){ drawEntity(e); });
  }

  var spriteCache = {};
  function getSpriteImage(url){
    var img = spriteCache[url];
    if(!img){
      img = new Image();
      img.onload = function(){ render(); };
      img.src = url;
      spriteCache[url] = img;
    }
    return img;
  }

  function drawEntity(e){
    var px = e.x*CELL, py = e.y*CELL;
    if(e.spriteUrl){
      var img = getSpriteImage(e.spriteUrl);
      if(img.complete && img.naturalWidth){
        var cols = e.spriteCols||1, rows = e.spriteRows||1;
        var fw = img.naturalWidth/cols, fh = img.naturalHeight/rows;
        var frame = (e.animFrame||0) % (cols*rows);
        var fx = (frame % cols) * fw, fy = Math.floor(frame/cols) * fh;
        ctx.drawImage(img, fx, fy, fw, fh, px+3, py+3, CELL-6, CELL-6);
        return;
      }
      // sprite still loading (or failed) - fall through to the shape below as a placeholder
    }
    var cx = px + CELL/2, cy = py + CELL/2;
    ctx.beginPath();
    ctx.arc(cx,cy,CELL*0.32,0,Math.PI*2);
    ctx.fillStyle = e.color;
    ctx.fill();
    ctx.lineWidth=2; ctx.strokeStyle="rgba(13,11,24,.5)"; ctx.stroke();
    ctx.fillStyle="#0d0b18"; ctx.font="11px sans-serif"; ctx.textAlign="center";
    ctx.fillText(TYPE_META[e.kind].icon, cx, cy+4);
  }

  function setStatus(text, isError){
    statusEl.className = isError ? 'err' : '';
    statusEl.textContent = text;
  }

  function findHero(){ return currentTerrain().entities.find(function(e){ return e.kind==='character'; }); }

  function updateHud(){
    var hero = findHero();
    var hud = document.getElementById('hudInfo');
    updateBagBadge();
    if (!hero || hero.maxHealth == null) { hud.textContent=''; hud.style.color=''; return; }
    var hp = Math.max(0, hero.health), max = hero.maxHealth;
    hud.textContent = 'HP ' + hp + '/' + max;
    hud.style.color = (hp <= max*0.3) ? 'var(--ember)' : '';
  }

  // ---------------- Inventory ----------------
  function parseHealthEffect(effect){
    if(!effect) return null;
    var m = /^\s*([+-]?\d+)\s*health\s*$/i.exec(effect);
    return m ? parseInt(m[1], 10) : null;
  }
  function updateBagBadge(){
    var hero = findHero();
    var inv = (hero && hero.inventory) || [];
    var total = inv.reduce(function(sum,it){ return sum+it.count; }, 0);
    var btn = document.getElementById('bagBtn');
    var existing = btn.querySelector('.count');
    if(total>0){
      if(!existing){ existing = document.createElement('span'); existing.className='count'; btn.appendChild(existing); }
      existing.textContent = total;
    } else if(existing){
      existing.remove();
    }
  }
  function renderBag(){
    var hero = findHero();
    var inv = (hero && hero.inventory) || [];
    var list = document.getElementById('bagList');
    var empty = document.getElementById('bagEmpty');
    list.innerHTML = '';
    empty.style.display = inv.length ? 'none' : 'block';
    inv.forEach(function(it, idx){
      var row = document.createElement('button');
      row.type = 'button';
      row.className = 'bagItem';
      var thumb = it.spriteUrl
        ? '<img src="'+it.spriteUrl+'" alt="">'
        : '<span class="sw" style="background:'+(it.color||'#888')+'"></span>';
      row.innerHTML = thumb +
        '<span class="info"><b></b><span></span></span>' +
        '<span class="count">x'+it.count+'</span>';
      row.querySelector('b').textContent = it.name;
      row.querySelector('.info span').textContent = it.effect || 'Tap to use';
      row.addEventListener('click', function(){ useItem(idx); });
      list.appendChild(row);
    });
  }
  function useItem(idx){
    var hero = findHero();
    if(!hero || !hero.inventory || !hero.inventory[idx]) return;
    var it = hero.inventory[idx];
    var healAmt = parseHealthEffect(it.effect);
    if(healAmt != null && hero.health != null){
      hero.health = hero.maxHealth ? Math.min(hero.maxHealth, hero.health + healAmt) : hero.health + healAmt;
      setStatus('Used '+it.name+' ('+(healAmt>=0?'+':'')+healAmt+' health).', false);
    } else if(it.effect){
      setStatus('Used '+it.name+': '+it.effect, false);
    } else {
      setStatus('Used '+it.name+'.', false);
    }
    it.count--;
    if(it.count<=0) hero.inventory.splice(idx,1);
    updateHud(); renderBag();
  }
  function openBag(){ renderBag(); document.getElementById('bagModalBg').classList.add('show'); }
  function closeBag(){ document.getElementById('bagModalBg').classList.remove('show'); }
  document.getElementById('bagBtn').addEventListener('click', openBag);
  document.getElementById('bagCloseBtn').addEventListener('click', closeBag);
  document.getElementById('bagModalBg').addEventListener('click', function(e){ if(e.target.id==='bagModalBg') closeBag(); });

  // ---------------- Scripting engine API (what the user's code talks to) ----------------
  function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

  function makeEngine(){
    function addEntity(kind,name,x,y,terrain){
      var def = resources[kind][name];
      if(!def) throw new Error('add'+cap(kind)+': no ' + kind + ' resource named "'+name+'" - create one with the + ' + cap(kind) + ' button');
      var entity = { kind:kind, name:name, x:x, y:y, color:def.color, animFrame:0 };
      for (var k in def) if (entity[k] === undefined) entity[k] = def[k];
      if (entity.health != null) entity.maxHealth = entity.health;
      ensureTerrain(terrain||DEFAULT_TERRAIN).entities.push(entity);
    }
    return {
      setBlock: function(x,y,name,terrain){
        if(y<0||y>=ROWS||x<0||x>=COLS) throw new Error('setBlock: ('+x+','+y+') is outside the '+COLS+'x'+ROWS+' grid');
        if(!resources.block[name]) throw new Error('setBlock: no block resource named "'+name+'" - create one with + Block');
        ensureTerrain(terrain||DEFAULT_TERRAIN).grid[y][x] = name;
      },
      clearBlock: function(x,y,terrain){ var t=ensureTerrain(terrain||DEFAULT_TERRAIN); if(t.grid[y]) t.grid[y][x]=null; },
      addCharacter: function(name,x,y,terrain){ addEntity('character',name,x,y,terrain); },
      addNPC: function(name,x,y,terrain){ addEntity('npc',name,x,y,terrain); },
      addMob: function(name,x,y,terrain){ addEntity('mob',name,x,y,terrain); },
      addItem: function(name,x,y,terrain){ addEntity('item',name,x,y,terrain); },
      addCustom: function(name,x,y,terrain){ addEntity('custom',name,x,y,terrain); },
      setActiveTerrain: function(name){ ensureTerrain(name); scene.active = name; },
      addConnector: function(x,y,toTerrain,toX,toY,terrain){
        if(!toTerrain) throw new Error('addConnector: missing target terrain');
        ensureTerrain(terrain||DEFAULT_TERRAIN).connectors.push({ x:x, y:y, toTerrain:toTerrain, toX:toX||0, toY:toY||0 });
      },
      clearAll: function(){ scene = emptyScene(); },
      log: function(){ logLines.push(Array.prototype.slice.call(arguments).map(String).join(' ')); }
    };
  }

  // ---------------- Run / live preview ----------------
  var codeInput = document.getElementById('codeInput');
  var statusEl = document.getElementById('status');
  var logLines = [];

  function runCode(){
    logLines = [];
    scene = emptyScene();
    var engine = makeEngine();
    try{
      var fn = new Function('engine', codeInput.value);
      fn(engine);
      render();
      updateHud();
      updateActionButton();
      var saved = saveLocal();
      setStatus((logLines.length ? logLines.join(' | ') : 'Ran successfully') + (saved ? ' \u00B7 saved' : ''), false);
    }catch(err){
      render();
      updateHud();
      updateActionButton();
      setStatus('Error: ' + err.message, true);
      saveLocal();
    }
  }

  var debounceTimer = null;
  codeInput.addEventListener('input', function(){
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(runCode, 500);
  });
  codeInput.addEventListener('keydown', function(e){
    if(e.key === 'Tab'){
      e.preventDefault();
      var s=codeInput.selectionStart, en=codeInput.selectionEnd;
      codeInput.value = codeInput.value.slice(0,s)+'  '+codeInput.value.slice(en);
      codeInput.selectionStart = codeInput.selectionEnd = s+2;
    }
  });
  document.getElementById('runBtn').addEventListener('click', function(){
    runCode();
    enterPlayMode();
  });
  document.getElementById('resetBtn').addEventListener('click', runCode);

  // ---------------- Play mode (fullscreen + landscape, entered from Run) ----------------
  function enterPlayMode(){
    document.body.classList.add('playMode');
    if(window.Android && window.Android.lockLandscape){
      window.Android.lockLandscape();
    } else if(screen.orientation && screen.orientation.lock){
      screen.orientation.lock('landscape').catch(function(){});
    }
  }
  function exitPlayMode(){
    document.body.classList.remove('playMode');
    if(window.Android && window.Android.unlockOrientation){
      window.Android.unlockOrientation();
    } else if(screen.orientation && screen.orientation.unlock){
      try{ screen.orientation.unlock(); }catch(e){}
    }
  }
  document.getElementById('exitPlayBtn').addEventListener('click', exitPlayMode);

  // Recovery path for exactly the mistake of shipping an exported game.html
  // as the editor's own index.html: everything the editor needs (resources,
  // script) is already sitting in memory from the EXPORTED_GAME boot, so
  // "editing" just means turning the chrome back on - no reload, no file
  // changes, no re-push needed.
  function promoteToEditor(){
    EXPORTED_GAME = null;
    document.body.classList.remove('standaloneGame');
    exitPlayMode();
    refreshPalette();
    setStatus('Now editing. This only changes what you see right now - to fix it permanently, replace this build\'s index.html/preview.html with the real editor files.', false);
  }
  document.getElementById('editThisGameBtn').addEventListener('click', promoteToEditor);

  // ---------------- Movement / collision / combat ----------------
  function performAttack(hero, mob){
    var t = currentTerrain();
    mob.health -= HERO_ATTACK_DAMAGE;
    hero.health -= MOB_ATTACK_DAMAGE;
    if(mob.health <= 0){
      t.entities = t.entities.filter(function(e){ return e!==mob; });
      setStatus(mob.name+' defeated!', false);
    }else{
      setStatus('Hit '+mob.name+'! ('+Math.max(0,mob.health)+' HP left)', false);
    }
    if(hero.health <= 0) setStatus('Hero was defeated! Tap Reset to try again.', true);
    render(); updateHud(); updateActionButton();
  }
  function showDialogue(npc){
    setStatus(npc.name+': "'+(npc.dialogue||'...')+'"', false);
  }
  function useConnector(hero, conn){
    var t = currentTerrain();
    t.entities = t.entities.filter(function(e){ return e!==hero; });
    scene.active = conn.toTerrain;
    var dest = ensureTerrain(scene.active);
    hero.x = conn.toX||0; hero.y = conn.toY||0;
    dest.entities = dest.entities.filter(function(e){ return e.kind!=='character'; });
    dest.entities.push(hero);
    setStatus('Entered ' + scene.active + '.', false);
    render(); updateHud(); updateActionButton();
  }

  function attemptMove(dx,dy){
    var t = currentTerrain();
    var hero = findHero();
    if(!hero){ setStatus('Add a Character and place it with addCharacter(...) to move.', false); return; }
    if(hero.health <= 0){ setStatus('Hero was defeated! Tap Reset to try again.', true); return; }

    var nx = hero.x+dx, ny = hero.y+dy;
    if(nx<0||nx>=COLS||ny<0||ny>=ROWS) return;

    var mob = t.entities.find(function(e){ return e.kind==='mob' && e.x===nx && e.y===ny; });
    if(mob){ performAttack(hero, mob); return; }

    var npc = t.entities.find(function(e){ return e.kind==='npc' && e.x===nx && e.y===ny; });
    if(npc){ showDialogue(npc); return; }

    var conn = (t.connectors||[]).find(function(c){ return c.x===nx && c.y===ny; });
    if(conn){ useConnector(hero, conn); return; }

    var blockName = t.grid[ny] ? t.grid[ny][nx] : null;
    var blockDef = blockName ? resources.block[blockName] : null;
    if(blockDef && blockDef.solid){ setStatus(blockName+' is in the way.', false); return; }

    var item = t.entities.find(function(e){ return e.kind==='item' && e.x===nx && e.y===ny; });
    if(item){
      t.entities = t.entities.filter(function(e){ return e!==item; });
      hero.inventory = hero.inventory || [];
      var stack = hero.inventory.find(function(it){ return it.name===item.name; });
      if(stack){ stack.count++; }
      else { hero.inventory.push({ name:item.name, count:1, color:item.color, spriteUrl:item.spriteUrl, effect:item.effect }); }
      setStatus('Picked up '+item.name+(item.effect?' ('+item.effect+')':'')+'! In bag now.', false);
    }

    hero.x = nx; hero.y = ny;
    hero.animFrame = (hero.animFrame||0) + 1;
    render(); updateHud(); updateActionButton();
  }

  // ---------------- Interact / Attack button (context-sensitive) ----------------
  var actionBtn = document.getElementById('actionBtn');
  var actionTarget = null;

  function updateActionButton(){
    var hero = findHero();
    actionTarget = null;
    if(hero && hero.health > 0){
      var t = currentTerrain();
      var deltas = [[0,-1],[0,1],[-1,0],[1,0]];
      var foundMob = null, foundNpc = null;
      deltas.forEach(function(d){
        var nx = hero.x+d[0], ny = hero.y+d[1];
        t.entities.forEach(function(e){
          if(e.x===nx && e.y===ny){
            if(e.kind==='mob' && !foundMob) foundMob = e;
            if(e.kind==='npc' && !foundNpc) foundNpc = e;
          }
        });
      });
      actionTarget = foundMob || foundNpc || null;
    }
    actionBtn.classList.remove('attack','talk','show');
    if(actionTarget && actionTarget.kind==='mob'){
      actionBtn.classList.add('attack','show');
      actionBtn.querySelector('.glyph').textContent = '\u2694';
      actionBtn.querySelector('.txt').textContent = 'Attack';
    }else if(actionTarget && actionTarget.kind==='npc'){
      actionBtn.classList.add('talk','show');
      actionBtn.querySelector('.glyph').textContent = '\uD83D\uDCAC';
      actionBtn.querySelector('.txt').textContent = 'Talk';
    }
  }
  actionBtn.addEventListener('click', function(){
    if(!actionTarget) return;
    var hero = findHero();
    if(!hero) return;
    if(actionTarget.kind==='mob') performAttack(hero, actionTarget);
    else if(actionTarget.kind==='npc') showDialogue(actionTarget);
  });

  // ---------------- Joystick control ----------------
  (function setupJoystick(){
    var base = document.getElementById('joyBase');
    var nub = document.getElementById('joyNub');
    var baseRadius = 42, halfNub = 18, maxDist = 22, deadZone = 12;
    var active = false, repeatTimer = null, currentDir = null;
    var DIR_DELTA = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };

    function centerNub(){ nub.style.left=(baseRadius-halfNub)+'px'; nub.style.top=(baseRadius-halfNub)+'px'; }
    centerNub();

    function stepInterval(){
      var hero = findHero();
      var speed = (hero && hero.speed) ? hero.speed : 3;
      return Math.max(120, 500 - speed*40);
    }
    function startRepeat(dir){
      if(currentDir === dir) return;
      currentDir = dir;
      clearInterval(repeatTimer);
      var d = DIR_DELTA[dir];
      attemptMove(d[0], d[1]);
      repeatTimer = setInterval(function(){ attemptMove(d[0], d[1]); }, stepInterval());
    }
    function stopRepeat(){ currentDir = null; clearInterval(repeatTimer); repeatTimer = null; }

    function handleMove(clientX, clientY){
      var rect = base.getBoundingClientRect();
      var cx = rect.left+rect.width/2, cy = rect.top+rect.height/2;
      var dx = clientX-cx, dy = clientY-cy;
      var dist = Math.min(Math.hypot(dx,dy), maxDist);
      var ang = Math.atan2(dy,dx);
      nub.style.left = (baseRadius-halfNub+Math.cos(ang)*dist)+'px';
      nub.style.top  = (baseRadius-halfNub+Math.sin(ang)*dist)+'px';
      if(Math.abs(dx) < deadZone && Math.abs(dy) < deadZone){ stopRepeat(); return; }
      var dir = Math.abs(dx) > Math.abs(dy) ? (dx>0?'right':'left') : (dy>0?'down':'up');
      startRepeat(dir);
    }
    function endDrag(){ active=false; centerNub(); stopRepeat(); }

    base.addEventListener('touchstart', function(e){ active=true; handleMove(e.touches[0].clientX,e.touches[0].clientY); e.preventDefault(); }, {passive:false});
    base.addEventListener('touchmove', function(e){ if(!active) return; handleMove(e.touches[0].clientX,e.touches[0].clientY); e.preventDefault(); }, {passive:false});
    base.addEventListener('touchend', function(e){ endDrag(); e.preventDefault(); }, {passive:false});
    base.addEventListener('touchcancel', function(e){ endDrag(); e.preventDefault(); }, {passive:false});
    base.addEventListener('mousedown', function(e){ active=true; handleMove(e.clientX,e.clientY); });
    window.addEventListener('mousemove', function(e){ if(!active) return; handleMove(e.clientX,e.clientY); });
    window.addEventListener('mouseup', function(){ if(active) endDrag(); });
  })();

  function tryCopy(text, done){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ done(true); }).catch(function(){ done(fallbackCopy()); });
    } else {
      done(fallbackCopy());
    }
    function fallbackCopy(){
      try{
        ioTextarea.focus();
        ioTextarea.setSelectionRange(0, ioTextarea.value.length);
        return document.execCommand('copy');
      }catch(e){ return false; }
    }
  }

  ioActionBtn.addEventListener('click', function(){
    if(ioMode === 'export'){
      tryCopy(ioTextarea.value, function(ok){
        setIoHint(ok ? 'Copied to clipboard!' : 'Could not auto-copy - select the text above and copy it manually.');
      });
    } else if(ioMode === 'import'){
      try{
        var data = JSON.parse(ioTextarea.value);
        if(!data || typeof data !== 'object' || !data.resources || typeof data.script !== 'string'){
          throw new Error('This does not look like a MiniEngine2D export.');
        }
        resources = data.resources;
        ['block','character','npc','mob','item','custom'].forEach(function(t){ if(!resources[t]) resources[t] = {}; });
        codeInput.value = data.script;

  // ---------------- Export Game (standalone playable HTML) ----------------
  // Turns the current project into a self-contained file: this same app,
  // with EXPORTED_GAME baked in so it loads straight into Play mode with
  // no editor chrome. Dropped into a copy of this project's
  // app/src/main/assets/index.html, it builds into a real APK through the
  // same GitHub Actions workflow this project already uses - a WebView
  // can't invoke a compiler itself, so that last step still has to happen
  // outside the app, same as it does for the editor APK you already build.
  function exportGameHtml(){
    var marker = 'var EXPORTED_GAME = null;';
    var payload;
    try{
      payload = JSON.stringify({ resources: resources, script: codeInput.value })
        .replace(/<\/script/gi, '<\\/script');
    }catch(e){
      setStatus('Export failed: could not serialise the project (' + e.message + ').', true);
      return;
    }
    setStatus('Exporting...', false);
    fetch(location.href).then(function(res){
      if(!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    }).then(function(sourceHtml){
      if(sourceHtml.indexOf(marker) === -1){
        throw new Error('marker not found - the source file may have been edited since this build');
      }
      var injected = sourceHtml.replace(marker, 'var EXPORTED_GAME = ' + payload + ';');
      var blob = new Blob([injected], { type: 'text/html' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'game.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      setStatus('Exported game.html - see README "Turning an exported game into an APK" for the next step.', false);
    }).catch(function(err){
      setStatus('Export failed: could not read this page\'s own source (' + err.message + '). ' +
        'If this happens inside the installed app, try opening preview.html in a regular browser tab instead - some WebView configurations restrict a page from reading its own file.', true);
    });
  }
  document.getElementById('exportGameBtn').addEventListener('click', exportGameHtml);

  // ---------------- Terrain painter (visual alternative to typing setBlock calls) ----------------

  function escapeRegex(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  function applyBlockSwatchStyle(el, def){
    if(def && def.spriteUrl){
      el.style.backgroundImage = 'url(' + def.spriteUrl + ')';
      el.style.backgroundSize = 'cover';
      el.style.backgroundPosition = 'center';

  function renderTerrainPalette(){
    var blockNames = Object.keys(resources.block);
    if(!blockNames.length || blockNames.indexOf(terrainBrush) === -1) terrainBrush = blockNames.length ? blockNames[0] : null;

    terrainPaletteEl.innerHTML = '';
    blockNames.forEach(function(nm){
      var sw = document.createElement('button');
      sw.type = 'button';
      sw.className = 'terrainSwatch' + (nm===terrainBrush ? ' selected':'');
      applyBlockSwatchStyle(sw, resources.block[nm]);
      sw.title = nm;
      sw.addEventListener('click', function(){
        terrainBrush = nm;
        Array.prototype.forEach.call(terrainPaletteEl.children, function(c){ c.classList.remove('selected'); });
        sw.classList.add('selected');
      });
      terrainPaletteEl.appendChild(sw);
    });
    var eraser = document.createElement('button');
    eraser.type = 'button';
    eraser.className = 'terrainSwatch' + (terrainBrush===null ? ' selected':'');
    eraser.textContent = '\u2716';
    eraser.title = 'Eraser';
    eraser.addEventListener('click', function(){
      terrainBrush = null;
      Array.prototype.forEach.call(terrainPaletteEl.children, function(c){ c.classList.remove('selected'); });

  function renderTerrainTabs(){
    terrainTabsEl.innerHTML = '';
    Object.keys(scene.terrains).forEach(function(name){
      var tab = document.createElement('button');
      tab.type = 'button';
      tab.className = 'terrainTab' + (name===activeEditTerrain ? ' active':'');
      tab.textContent = name;
      tab.addEventListener('click', function(){
        if(name === activeEditTerrain) return;

  function showTerrainError(msg){ document.getElementById('terrainError').textContent = msg || ''; }

  function handleAddTerrain(prefill){
    var input = document.getElementById('terrainNewName');
    var name = (prefill != null ? prefill : input.value).trim();
    if(!name){ showTerrainError('Enter a name for the new terrain first.'); input.focus(); return; }
    if(scene.terrains[name]){
      showTerrainError('"'+name+'" already exists - switching to it.');
      commitPainterState();
      activeEditTerrain = name;
      input.value = '';
      renderTerrainTabs();
      loadTerrainIntoPainter(name);

    showTerrainError('');

    var t = ensureTerrain(name);

    renderTerrainGrid();

  function commitPainterState(){
    if(!terrainState) return;
    var t = ensureTerrain(activeEditTerrain);
    t.grid = terrainState.map(function(row){ return row.slice(); });

  function openTerrainPainter(createNew){
    var names = Object.keys(scene.terrains);
    activeEditTerrain = (activeEditTerrain && scene.terrains[activeEditTerrain]) ? activeEditTerrain
      : (scene.terrains[scene.active] ? scene.active : (names[0] || DEFAULT_TERRAIN));
    ensureTerrain(activeEditTerrain);

  function renderTerrainGrid(){
    terrainGridEl.innerHTML = '';
    for(var r=0;r<ROWS;r++){
      for(var c=0;c<COLS;c++){
        var cell = document.createElement('div');
        cell.className = 'terrainCell';
        cell.dataset.x = c; cell.dataset.y = r;
        paintCellVisual(cell, terrainState[r][c]);
        terrainGridEl.appendChild(cell);

  function paintCellVisual(cell, blockName){
    applyBlockSwatchStyle(cell, (blockName && resources.block[blockName]) ? resources.block[blockName] : null);
  }
  function paintAt(clientX, clientY){
    var el = document.elementFromPoint(clientX, clientY);
    if(!el || !el.classList || !el.classList.contains('terrainCell')) return;
    var x = Number(el.dataset.x), y = Number(el.dataset.y);
    terrainState[y][x] = terrainBrush;
    paintCellVisual(el, terrainBrush);
  }
  terrainGridEl.addEventListener('touchstart', function(e){ terrainPainting=true; paintAt(e.touches[0].clientX,e.touches[0].clientY); e.preventDefault(); }, {passive:false});
  terrainGridEl.addEventListener('touchmove', function(e){ if(!terrainPainting) return; paintAt(e.touches[0].clientX,e.touches[0].clientY); e.preventDefault(); }, {passive:false});
  terrainGridEl.addEventListener('touchend', function(e){ terrainPainting=false; e.preventDefault(); }, {passive:false});
  terrainGridEl.addEventListener('mousedown', function(e){ terrainPainting=true; paintAt(e.clientX,e.clientY); });
  terrainGridEl.addEventListener('mousemove', function(e){ if(!terrainPainting) return; paintAt(e.clientX,e.clientY); });
  window.addEventListener('mouseup', function(){ terrainPainting=false; });

  function closeTerrainPainter(){ terrainModalBg.classList.remove('open'); terrainState = null; }

  function writeTerrainCodeBlock(name, grid){
    var lines = ['// --- terrain:'+name+':start ---'];
    for(var r=0;r<ROWS;r++){
      for(var c=0;c<COLS;c++){
        if(grid[r][c]) lines.push('engine.setBlock('+c+', '+r+', "'+grid[r][c]+'", "'+name+'");');
      }
    }
    lines.push('// --- terrain:'+name+':end ---');
    var block = lines.join('\n');
    var marker = new RegExp('// --- terrain:'+escapeRegex(name)+':start ---[\\s\\S]*?// --- terrain:'+escapeRegex(name)+':end ---');
    if(marker.test(codeInput.value)){
      codeInput.value = codeInput.value.replace(marker, block);
    } else {
      var sep = (codeInput.value.length && !/\n$/.test(codeInput.value)) ? '\n' : '';
      codeInput.value = codeInput.value + sep + block + '\n';
    }
  }

  document.getElementById('terrainDoneBtn').addEventListener('click', function(){
    commitPainterState();
    Object.keys(scene.terrains).forEach(function(name){
      writeTerrainCodeBlock(name, scene.terrains[name].grid);
    });
    closeTerrainPainter();
    runCode();
  });

  document.getElementById('terrainAddBtn').addEventListener('click', function(){ openTerrainPainter(true); });
  document.getElementById('terrainEditBtn').addEventListener('click', function(){ openTerrainPainter(false); });
  document.getElementById('terrainNewBtn').addEventListener('click', function(){ handleAddTerrain(); });
  document.getElementById('terrainNewName').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); handleAddTerrain(); }
  });

  // ---------------- Terrain connector (place-specific, reusable everywhere) ----------------
  var connectorModalBg = document.getElementById('connectorModalBg');
  var cFromSelect = document.getElementById('cFromTerrain');
  var cToSelect = document.getElementById('cToTerrain');
  var cFromGridEl = document.getElementById('cFromGrid');
  var cToGridEl = document.getElementById('cToGrid');
  var connectorFromTerrain, connectorFromX, connectorFromY;
  var connectorToTerrain, connectorToX, connectorToY;
  var editingConnector = null; // { terrain, index } or null when creating fresh

  function writeConnectorsCodeBlock(){
    var lines = ['// --- connectors:start ---'];
    Object.keys(scene.terrains).forEach(function(tname){
      (scene.terrains[tname].connectors||[]).forEach(function(c){
        lines.push('engine.addConnector('+c.x+', '+c.y+', "'+c.toTerrain+'", '+c.toX+', '+c.toY+', "'+tname+'");');
      });
    });
    lines.push('// --- connectors:end ---');
    var block = lines.join('\n');
    var marker = /\/\/ --- connectors:start ---[\s\S]*?\/\/ --- connectors:end ---/;
    if(marker.test(codeInput.value)){
      codeInput.value = codeInput.value.replace(marker, block);
    } else {
      var sep = (codeInput.value.length && !/\n$/.test(codeInput.value)) ? '\n' : '';
      codeInput.value = codeInput.value + sep + block + '\n';
    }
  }

  function populateTerrainSelect(sel, selected){
    sel.innerHTML = Object.keys(scene.terrains).map(function(n){
      return '<option value="'+escapeHtml(n)+'"'+(n===selected?' selected':'')+'>'+escapeHtml(n)+'</option>';
    }).join('');
  }

  function renderPickGrid(gridEl, terrainName, selX, selY, onPick){
    var t = ensureTerrain(terrainName);
    gridEl.innerHTML = '';
    for(var r=0;r<ROWS;r++){
      for(var c=0;c<COLS;c++){
        var cell = document.createElement('button');
        cell.type = 'button';
        cell.className = 'pickCell' + (c===selX && r===selY ? ' selected' : '');
        var blockName = t.grid[r][c];
        cell.style.background = (blockName && resources.block[blockName]) ? resources.block[blockName].color : '#1c1926';
        cell.addEventListener('click', (function(cx,cy){ return function(){ onPick(cx,cy); }; })(c,r));
        gridEl.appendChild(cell);
      }
    }
  }

  function syncConnectorGrids(){
    renderPickGrid(cFromGridEl, connectorFromTerrain, connectorFromX, connectorFromY, function(x,y){
      connectorFromX = x; connectorFromY = y;
      syncConnectorGrids();
    });
    renderPickGrid(cToGridEl, connectorToTerrain, connectorToX, connectorToY, function(x,y){
      connectorToX = x; connectorToY = y;
      syncConnectorGrids();
    });
  }

  function refreshConnectorList(){
    var el = document.getElementById('connectorExisting');
    el.innerHTML = '';
    var any = false;
    Object.keys(scene.terrains).forEach(function(tname){
      (scene.terrains[tname].connectors||[]).forEach(function(c, idx){
        any = true;
        var b = document.createElement('button');
        b.type = 'button';
        var isActive = editingConnector && editingConnector.terrain===tname && editingConnector.index===idx;
        b.className = isActive ? 'active' : '';
        b.textContent = tname+' ('+c.x+','+c.y+') \u2192 '+c.toTerrain+' ('+c.toX+','+c.toY+')';
        b.addEventListener('click', function(){ loadConnectorIntoForm({terrain:tname, index:idx}); });
        el.appendChild(b);
      });
    });
    if(!any){
      var hint = document.createElement('span');
      hint.className = 'hint';
      hint.textContent = 'No connectors yet - fill in the form below to create one.';
      el.appendChild(hint);
    }
  }

  function loadConnectorIntoForm(ref){
    editingConnector = ref;
    var c = scene.terrains[ref.terrain].connectors[ref.index];
    connectorFromTerrain = ref.terrain; connectorFromX = c.x; connectorFromY = c.y;
    connectorToTerrain = c.toTerrain; connectorToX = c.toX; connectorToY = c.toY;
    populateTerrainSelect(cFromSelect, connectorFromTerrain);
    populateTerrainSelect(cToSelect, connectorToTerrain);
    syncConnectorGrids();
    document.getElementById('connectorDeleteBtn').style.display = 'block';
    refreshConnectorList();
  }

  function openConnectorModal(){
    document.getElementById('connectorError').textContent = '';
    var names = Object.keys(scene.terrains);
    editingConnector = null;
    connectorFromTerrain = (scene.terrains[scene.active] ? scene.active : names[0]) || DEFAULT_TERRAIN;
    connectorToTerrain = names.filter(function(n){ return n!==connectorFromTerrain; })[0] || connectorFromTerrain;
    connectorFromX = 0; connectorFromY = 0; connectorToX = 0; connectorToY = 0;
    populateTerrainSelect(cFromSelect, connectorFromTerrain);
    populateTerrainSelect(cToSelect, connectorToTerrain);
    syncConnectorGrids();
    document.getElementById('connectorDeleteBtn').style.display = 'none';
    refreshConnectorList();
    connectorModalBg.classList.add('open');
  }
  function closeConnectorModal(){ connectorModalBg.classList.remove('open'); }

  cFromSelect.addEventListener('change', function(){ connectorFromTerrain = cFromSelect.value; syncConnectorGrids(); });
  cToSelect.addEventListener('change', function(){ connectorToTerrain = cToSelect.value; syncConnectorGrids(); });

  function connectorPairExists(terrain, x, y, toTerrain, toX, toY){
    return ensureTerrain(terrain).connectors.some(function(c){
      return c.x===x && c.y===y && c.toTerrain===toTerrain && c.toX===toX && c.toY===toY;
    });
  }

  document.getElementById('connectorSaveBtn').addEventListener('click', function(){
    document.getElementById('connectorError').textContent = '';
    if(connectorFromTerrain===connectorToTerrain && connectorFromX===connectorToX && connectorFromY===connectorToY){
      document.getElementById('connectorError').textContent = "From and to can't be the same spot.";
      return;
    }
    if(editingConnector){
      ensureTerrain(editingConnector.terrain).connectors.splice(editingConnector.index, 1);
    }
    ensureTerrain(connectorFromTerrain).connectors.push({ x:connectorFromX, y:connectorFromY, toTerrain:connectorToTerrain, toX:connectorToX, toY:connectorToY });
    if(document.getElementById('cBothWays').checked &&
       !connectorPairExists(connectorToTerrain, connectorToX, connectorToY, connectorFromTerrain, connectorFromX, connectorFromY)){
      ensureTerrain(connectorToTerrain).connectors.push({ x:connectorToX, y:connectorToY, toTerrain:connectorFromTerrain, toX:connectorFromX, toY:connectorFromY });
    }
    writeConnectorsCodeBlock();
    closeConnectorModal();
    runCode();
  });
  document.getElementById('connectorDeleteBtn').addEventListener('click', function(){
    if(editingConnector){
      ensureTerrain(editingConnector.terrain).connectors.splice(editingConnector.index, 1);
      writeConnectorsCodeBlock();
    }
    closeConnectorModal();
    runCode();
  });
  document.getElementById('connectorCancelBtn').addEventListener('click', closeConnectorModal);

  document.getElementById('connectorAddBtn').addEventListener('click', openConnectorModal);
  document.getElementById('connectorEditBtn').addEventListener('click', openConnectorModal);

  // ---------------- init ----------------
  if (EXPORTED_GAME) {
    resources = EXPORTED_GAME.resources || resources;
    ['block','character','npc','mob','item','custom'].forEach(function(t){ if(!resources[t]) resources[t] = {}; });
    codeInput.value = EXPORTED_GAME.script || '';
    document.body.classList.add('standaloneGame');
  } else if(!loadLocal()){
    applyDefaults();
  }
  ensureRoadBlockSeeded();
  refreshPalette();
  runCode();
  if (EXPORTED_GAME) { enterPlayMode(); }
})();
</script>
</body>
</html>
